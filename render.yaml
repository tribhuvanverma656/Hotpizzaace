# Development preview only. Shared orders require the separately deployed Supabase migration/function.
services:
  - type: web
    name: hotpizzaace-development
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/Satya2n/hotpizzaace
    branch: staging
    buildCommand: npm ci --include=dev && npm run lint && npm test && npm run build && npm run typecheck
    startCommand: npm start
    autoDeployTrigger: checksPass
    healthCheckPath: /api/liveness
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: COMMERCE_ENABLED
        value: 'true'
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_COUNTER_UPI_ID
        sync: false
      - key: NEXT_PUBLIC_COUNTER_UPI_NAME
        sync: false
